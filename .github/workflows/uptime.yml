name: Uptime monitor (аудит P2-2)
on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: health check (2 попытки)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ok=0
          for i in 1 2; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://anistream-catalog.vercel.app/api/health || true)
            body=$(curl -s --max-time 20 https://anistream-catalog.vercel.app/api/health || true)
            if [ "$code" = "200" ] && echo "$body" | grep -q '"ok":true'; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" = "1" ]; then echo "health OK"; exit 0; fi
          echo "health FAIL (2 попытки)"
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT_ID" -d text="🚨 AniNova DOWN: /api/health не отвечает (2 попытки, $(date -u +%FT%TZ))" > /dev/null
          fi
          exit 1
