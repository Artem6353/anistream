name: Provider cache migration dry run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/provider-cache-migration-dry-run.yml'
      - 'scripts/migrate-provider-cache-to-upstash.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-cache-migration-dry-run.yml'
      - 'scripts/migrate-provider-cache-to-upstash.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dry-run:
    name: Inspect eligible cache records (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calculate migration inventory without Redis writes
        run: |
          set -euo pipefail
          node scripts/migrate-provider-cache-to-upstash.mjs \
            --file .cache/providers-resolve-cache.json \
            --dry-run
