name: E2E (Playwright)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test   # 5 сценариев (e2e/smoke.spec.ts), прод-сервер поднимает webServer конфига
      # Аудит 30.09 (волна 2): lab-гейт Lighthouse на прод-сборке: деградация
      # perf/seo/a11y ниже порогов роняет CI. Пороги сознательно мягкие (lab-скоринг
      # в CI шумный): ловим регрессии, а не абслютные значения.
      - name: lighthouse gate
        run: |
          (npm run start &) && sleep 8
          # Warm the SSR route and the first hero image before measuring. The /img
          # proxy has its own cold-cache cost; including it in a single Lighthouse
          # sample makes the score unusually sensitive to runner load.
          node <<'NODE'
          (async () => {
            const base = 'http://localhost:3000';
            try {
              const response = await fetch(base + '/');
              const html = await response.text();
              const heroTag = html.match(/<img\b[^>]*class="hero__bg[^"]*"[^>]*>/)?.[0];
              const src = heroTag?.match(/\bsrc="([^"]+)"/)?.[1];
              if (src) {
                const imageUrl = new URL(src.replace(/&amp;/g, '&'), base);
                const image = await fetch(imageUrl);
                await image.arrayBuffer();
                console.log('Lighthouse warm-up: hero image primed', image.status);
              } else {
                console.log('Lighthouse warm-up: hero image was not found; route was primed');
              }
            } catch (error) {
              console.log('Lighthouse warm-up was non-fatal:', String(error));
            }
          })();
          NODE

          # Mobile Lighthouse scoring is noisy on shared CI runners. Take three
          # sequential samples and gate on the median, not a single outlier.
          for i in 1 2 3; do
            echo "Lighthouse sample $i/3"
            npx -y lighthouse@12 http://localhost:3000/ \
              --only-categories=performance,seo,accessibility \
              --chrome-flags="--no-sandbox --headless=new" \
              --output=json --output-path="/tmp/lh-ci-$i.json" --quiet
          done

          node <<'NODE'
          const fs = require('node:fs');
          const files = [1, 2, 3].map((i) => `/tmp/lh-ci-${i}.json`);
          const reports = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')));
          const score = (report, category) => Math.round((report.categories?.[category]?.score ?? 0) * 100);
          const median = (values) => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          const samples = reports.map((report, index) => ({
            sample: index + 1,
            performance: score(report, 'performance'),
            seo: score(report, 'seo'),
            accessibility: score(report, 'accessibility'),
          }));
          const medians = {
            performance: median(samples.map((sample) => sample.performance)),
            seo: median(samples.map((sample) => sample.seo)),
            accessibility: median(samples.map((sample) => sample.accessibility)),
          };
          console.log('Lighthouse samples:', JSON.stringify(samples));
          console.log('Lighthouse median scores:', JSON.stringify(medians));

          // Keep the report nearest the median Performance score for the diagnostics
          // step, while retaining all three originals as workflow artifacts.
          const medianReportIndex = samples
            .map((sample) => Math.abs(sample.performance - medians.performance))
            .indexOf(Math.min(...samples.map((sample) => Math.abs(sample.performance - medians.performance))));
          fs.copyFileSync(files[medianReportIndex], '/tmp/lh-ci.json');

          if (medians.seo < 95 || medians.accessibility < 95 || medians.performance < 80) {
            console.error('::error::Lighthouse median gate failed');
            process.exit(1);
          }
          NODE

      # Always emit useful Lighthouse details, even when the performance gate fails.
      - name: Lighthouse diagnostics
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('/tmp/lh-ci.json')) {
            console.log('Lighthouse JSON was not generated.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync('/tmp/lh-ci.json', 'utf8'));
          const score = (category) => Math.round((report.categories?.[category]?.score ?? 0) * 100);
          const audits = report.audits ?? {};
          const metricIds = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'server-response-time',
            'total-byte-weight',
          ];
          console.log('Lighthouse category scores:', JSON.stringify({
            performance: score('performance'),
            seo: score('seo'),
            accessibility: score('accessibility'),
          }));
          console.log('Lighthouse key metrics:', JSON.stringify(
            Object.fromEntries(metricIds.map((id) => [id, {
              score: audits[id]?.score ?? null,
              displayValue: audits[id]?.displayValue ?? null,
            }]))
          ));
          const opportunities = Object.values(audits)
            .filter((audit) => audit.details?.type === 'opportunity')
            .map((audit) => ({
              id: audit.id,
              title: audit.title,
              score: audit.score,
              savingsMs: audit.details?.overallSavingsMs ?? 0,
              savingsBytes: audit.details?.overallSavingsBytes ?? 0,
            }))
            .filter((audit) => audit.savingsMs > 0 || audit.savingsBytes > 0)
            .sort((a, b) => b.savingsMs - a.savingsMs || b.savingsBytes - a.savingsBytes)
            .slice(0, 10);
          console.log('Lighthouse top opportunities:', JSON.stringify(opportunities));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: /tmp/lh-ci*.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
