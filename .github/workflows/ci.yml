name: CI
# Аудит 30.09 (стиль-2): CI запускался только на pull_request — прямые пуши в main
# (основной сценарий работы с репо) не проверялись вовсе. Добавлен push-триггер
# (docs-only изменения пропускаем) и шаг ESLint (линтер в проект добавлен).
on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: compile Python importers and player bridges
        run: python -m py_compile scripts/import-kodik-bulk.py bridges/kodik_bridge.py bridges/multi_player_bridge.py
      - name: test Kodik bulk importer matching and cache merge
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: validate catalog integrity
        run: node scripts/validate-catalog.mjs
      # Аудит 30.09 (LIMITS.md «Git-хранилище»): titles.json коммитится кронами —
      # контролируем рост pack-файла; порог миграции на внешнее хранилище — 300 МБ.
      - name: repo size watch
        run: |
          git count-objects -vH | grep size-pack
          SIZE_KB=$(git count-objects -v | awk '/size-pack/ {print $2}')
          if [ "$SIZE_KB" -gt 307200 ]; then echo "::warning::pack >300MB — пора выносить titles.json из git (см. LIMITS.md)"; fi
      # Attach the "episode-coverage-audit" PR label to run a full read-only
      # comparison between the checked-in catalog and checked-in provider cache.
      - name: On-demand episode coverage audit
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'episode-coverage-audit')
        run: |
          npm run audit:episodes
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.cache/episode-coverage-report.json', 'utf8'));
          console.log('EPISODE_COVERAGE_SUMMARY=' + JSON.stringify(report.summary));
          console.log('LOWEST_COVERAGE_TITLES_BEGIN');
          for (const item of report.titles.slice(0, 40)) {
            const ranges = item.missingEpisodeRanges
              .map(([first, last]) => first === last ? String(first) : first + '-' + last)
              .join(',');
            console.log(item.slug + '\t' + item.coveragePercent + '%\t' +
              item.episodesWithDirectSources + '/' + item.episodesExpected +
              '\tmissing=' + (ranges || 'none'));
          }
          console.log('LOWEST_COVERAGE_TITLES_END');
          NODE
      # Read-only size estimate; never writes to Upstash. The 45 MB safety gate
      # in the separate apply workflow is why we measure before migrating the cache.
      - name: Estimate Upstash migration footprint (read-only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'episode-coverage-audit')
        run: |
          node scripts/migrate-provider-cache-to-upstash.mjs \
            --file .cache/providers-resolve-cache.json \
            --dry-run
      - name: Estimate compressed episode-cache value sizes (read-only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'episode-coverage-audit')
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const store = JSON.parse(fs.readFileSync('.cache/providers-resolve-cache.json', 'utf8'));
          const now = Date.now();
          const defaultTtl = Number(process.env.KODIK_CACHE_TTL_MS || 86400000);
          const isDirect = (s) => s && typeof s === 'object' &&
            s.providerId !== 'demo' && !s.guessed && !s.synthesized && !/:s\\d+$/.test(String(s.id || ''));
          const rows = [];
          const bySlug = new Map();
          let rawBytes = 0, fullDeflateBase64Bytes = 0, compactDeflateBase64Bytes = 0;
          let directSources = 0;
          const base64Size = (n) => 4 * Math.ceil(n / 3) + 3; // includes the future "z1:" storage prefix
          for (const [key, entry] of Object.entries(store)) {
            const match = /^ep:([^:]+):(\\d+)$/.exec(key);
            if (!match || !entry || typeof entry !== 'object' || !entry.sources || !Array.isArray(entry.sources.sources)) continue;
            const at = Number(entry.at), ttlMs = Number(entry.ttlMs ?? defaultTtl);
            if (!Number.isFinite(at) || !Number.isFinite(ttlMs) || ttlMs <= 0 || now - at > ttlMs) continue;
            const sources = entry.sources.sources.filter(isDirect);
            if (!sources.length) continue;
            directSources += sources.length;
            const record = { at: entry.at, ttlMs: entry.ttlMs ?? defaultTtl, sources: { ...entry.sources, sources } };
            const full = Buffer.from(JSON.stringify(record), 'utf8');
            rawBytes += full.length;
            fullDeflateBase64Bytes += base64Size(zlib.deflateRawSync(full).length);
            const compactSource = (s) => {
              const v = { i: s.id, l: s.label, p: s.providerId };
              if (s.providerName && s.providerName !== s.providerId) v.n = s.providerName;
              if (s.kind && s.kind !== 'embed') v.k = s.kind;
              if (s.embedUrl) v.e = s.embedUrl;
              if (Array.isArray(s.files) && s.files.length) v.f = s.files.map((f) => [f.quality, f.url, f.type]);
              if (s.translationId !== undefined) v.t = s.translationId;
              if (s.voice && s.voice !== 'voice') v.v = s.voice;
              if (s.guessed) v.g = 1;
              if (s.synthesized) v.y = 1;
              if (s.contentType && s.contentType !== 'anime-serial') v.c = s.contentType;
              return v;
            };
            const meta = entry.sources;
            const compact = {
              v: 1, at: entry.at, ttl: entry.ttlMs ?? defaultTtl,
              s: sources.map(compactSource),
            };
            if (Array.isArray(meta.sourcesUsed) && meta.sourcesUsed.length) compact.u = meta.sourcesUsed;
            if (meta.fromCache !== undefined) compact.fc = meta.fromCache;
            if (meta.cachedAt !== undefined) compact.ca = meta.cachedAt;
            if (meta.skip !== undefined) compact.sk = meta.skip;
            if (meta.errors !== undefined) compact.er = meta.errors;
            if (meta.providerChecks !== undefined) compact.pc = meta.providerChecks;
            const compactBytes = Buffer.from(JSON.stringify(compact), 'utf8');
            compactDeflateBase64Bytes += base64Size(zlib.deflateRawSync(compactBytes).length);
            const slug = match[1];
            if (!bySlug.has(slug)) bySlug.set(slug, []);
            bySlug.get(slug).push(Number(match[2]));
          }
          let indexBytes = 0;
          for (const episodes of bySlug.values()) indexBytes += Buffer.byteLength(JSON.stringify([...new Set(episodes)].sort((a,b)=>a-b).slice(-2000)), 'utf8');
          const report = {
            eligibleEpisodeRecords: bySlug.size ? [...bySlug.values()].reduce((n, eps) => n + new Set(eps).size, 0) : 0,
            uniqueTitles: bySlug.size,
            directSources,
            originalSerializedBytes: rawBytes + indexBytes,
            fullJsonDeflateBase64Bytes: fullDeflateBase64Bytes + indexBytes,
            compactJsonDeflateBase64Bytes: compactDeflateBase64Bytes + indexBytes,
            estimatedCompactMiB: +((compactDeflateBase64Bytes + indexBytes) / 1048576).toFixed(2),
            safeFreeTierBudgetBytes: 45000000,
            note: 'Estimate only; excludes Redis key/allocator overhead. No cache values or Upstash data were modified.',
          };
          console.log('EPISODE_CACHE_COMPRESSION_ESTIMATE=' + JSON.stringify(report));
          NODE
      - name: Upload episode coverage report
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'episode-coverage-audit')
        uses: actions/upload-artifact@v4
        with:
          name: episode-coverage-report
          path: .cache/episode-coverage-report.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: smoke
        run: |
          (npm run start &) && sleep 8
          SMOKE_URL=http://localhost:3000 npm run smoke
