name: Push test (manual end-to-end check)
on:
  workflow_dispatch:   # аудит блок 3: ручная проверка доставки пуша до устройства
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev || npm i web-push --no-save
      - run: node scripts/send-push.mjs --test
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_CONTACT: ${{ secrets.PUSH_CONTACT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
