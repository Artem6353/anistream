name: Refresh Kodik episode cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-kodik-episode-cache.yml'

permissions:
  contents: write

concurrency:
  group: aninova-kodik-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh exact Kodik episode links and report coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Kodik parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests https://github.com/YaNesyTortiK/AnimeParsers/archive/refs/heads/main.zip

      - name: Refresh cache from current paginated Kodik results
        env:
          KODIK_BULK_DELAY_MS: '750'
          KODIK_BULK_SAVE_EVERY_PAGES: '10'
        run: |
          set -euo pipefail
          python -m py_compile scripts/import-kodik-bulk.py bridges/kodik_bridge.py
          python scripts/import-kodik-bulk.py --restart --apply

      - name: Audit refreshed sources (upcoming titles excluded)
        run: |
          set -euo pipefail
          node scripts/audit-episode-coverage.mjs \
            --output .cache/episode-coverage-report.json

      - name: Calculate guarded Upstash migration estimate (read-only)
        run: |
          set -euo pipefail
          node scripts/migrate-provider-cache-to-upstash.mjs \
            --file .cache/providers-resolve-cache.json \
            --retention-days 30 \
            --dry-run | tee .cache/episode-cache-upstash-dry-run.txt

      - name: Summarize refresh and migration readiness
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const progress = JSON.parse(fs.readFileSync('.cache/kodik-bulk-import-progress.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('.cache/episode-coverage-report.json', 'utf8'));
          const estimate = fs.readFileSync('.cache/episode-cache-upstash-dry-run.txt', 'utf8');
          const summary = report.summary;
          const lines = [
            '# Kodik cache refresh',
            '',
            '- Pagination completed: **' + Boolean(progress.completed) + '**',
            '- Materials processed: **' + progress.materialsProcessed + '**',
            '- Unique catalog titles matched by Kodik: **' + progress.matchedTitles + '**',
            '- Exact episode links observed: **' + progress.episodeLinksSeen + '**',
            '- Cache episode entries updated/refreshed: **' + progress.episodeEntriesUpdated + '**',
            '- New distinct source URLs added: **' + progress.newSources + '**',
            '',
            '## Coverage after refresh (upcoming titles excluded)',
            '',
            '- Catalog titles: **' + summary.catalogTitles + '**; eligible: **' + summary.eligibleTitles + '**',
            '- Expected episodes: **' + summary.eligibleExpectedEpisodes + '**',
            '- Fresh direct-source entries: **' + summary.directCoveredEpisodes + ' / ' + summary.eligibleExpectedEpisodes + ' (' + summary.directEpisodeCoveragePercent + '%)**',
            '- Historical exact-source presence: **' + summary.historicalDirectCoveredEpisodes + ' / ' + summary.eligibleExpectedEpisodes + ' (' + summary.historicalDirectEpisodeCoveragePercent + '%)**',
            '- Episodes with no exact direct-source entry in cache: **' + summary.historicalMissingEpisodes + '**',
            '- Titles with no historical direct sources: **' + summary.historicalNoDirectSourceTitles + '**',
            '',
            '## Upstash migration dry-run',
            '',
            'Read-only estimate below; this workflow does not write to Redis. The existing guarded apply workflow also checks production codec compatibility, the 45 MB safety budget, secrets and the explicit confirmation string.',
            '',
            'Migration estimate output:',
            estimate.trim(),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(JSON.stringify({
            pagesCompleted: progress.pagesCompleted,
            completed: progress.completed,
            matchedTitles: progress.matchedTitles,
            episodeEntriesUpdated: progress.episodeEntriesUpdated,
            newSources: progress.newSources,
            expectedEpisodes: summary.eligibleExpectedEpisodes,
            freshCovered: summary.directCoveredEpisodes,
            historicalCovered: summary.historicalDirectCoveredEpisodes,
            historicalMissing: summary.historicalMissingEpisodes,
          }));
          NODE

      - name: Commit refreshed cache safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/providers-resolve-cache.json
          if git diff --cached --quiet; then
            echo "The cache did not change; no commit is needed."
            exit 0
          fi
          git commit -m "chore(cache): refresh exact Kodik episode source TTLs"
          bash scripts/push-catalog-commit.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kodik-episode-cache-refresh-report
          path: |
            .cache/kodik-bulk-import-progress.json
            .cache/episode-coverage-report.json
            .cache/episode-cache-upstash-dry-run.txt
          if-no-files-found: ignore
          retention-days: 14
