name: Sync catalog (auto-add new anime)
on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов (ТЗ 3.4): базовые проходы (популярные/онгоинги/анонсы), без deep
  workflow_dispatch:        # ручной запуск: разовое глубокое расширение каталога (+350–400 тайтлов)
    inputs:
      deep:
        description: "Глубокое расширение: хвосты favourites/фильмы/ONA/OVA (разовая порция новых тайтлов)"
        type: boolean
        default: true
      max_new:
        description: "Квота новых тайтлов MAX_NEW (0 = без лимита)"
        type: string
        default: "3000"
      use_jikan:
        description: "Добор каталога через Jikan (MyAnimeList): только ручной запуск, cron не гоняет"
        type: boolean
        default: false
# Prevent scheduled and manual catalog sync jobs from racing while committing batches.
concurrency:
  group: aninova-catalog-sync
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev || true
      - name: validate catalog before external updates
        run: node scripts/validate-catalog.mjs
      - name: expand catalog (new titles + franchise links + characters)
        env:
          # dispatch: deep/max_new из inputs; cron: deep выключен, квота 200 (ТЗ блок 12).
          DEEP: ${{ inputs.deep }}
          MAX_NEW: ${{ github.event_name == 'workflow_dispatch' && inputs.max_new || '200' }}
        run: node scripts/expand-catalog.mjs 12 --report
      - name: fetch jikan (MyAnimeList extra)
        if: ${{ inputs.use_jikan == true }}
        run: node scripts/fetch-jikan.mjs --limit 3000
        timeout-minutes: 60
        continue-on-error: true
      - name: remove hentai (18+ policy, safety net)
        run: node scripts/remove-hentai.mjs
      - name: validate catalog after initial mutations
        run: node scripts/validate-catalog.mjs
      - name: enrich with Shikimori (batched)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          for i in 1 2 3 4 5 6; do
            node scripts/enrich-shikimori-resumable.mjs --limit 500 || true
            node scripts/validate-catalog.mjs || exit 1
            git add lib/data/titles.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(catalog): enrich batch $i"
              bash scripts/push-catalog-commit.sh
            fi
            echo "batch $i done"
          done
      # P0-5: heal — это добор картинок/персонажей из Jikan, а не добавление тайтлов.
      # Прогон 17.11 упал по таймауту 60 мин: 6 батчей × 500 тайтлов × ~2 с = ~100 мин,
      # при этом Jikan отдавал пустые ответы (кадров+ 0, персонажей+ 0).
      # Теперь: шаг не красит workflow в красный, есть проверка доступности Jikan,
      # внутренний дедлайн и ретраи с бэкоффом.
      - name: heal screenshots+characters (batched, Jikan pictures)
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -uo pipefail
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"

          # Внутренний дедлайн: шаг должен завершиться сам, а не быть убитым таймаутом
          # (иначе прогон теряет commit/push уже собранного heal-батча).
          deadline=$(( $(date +%s) + 40*60 ))

          # Jikan — узкое место и главная причина «нулевых» батчей. Если он недоступен
          # или блокирует раннер, 500 тайтлов по 2 секунды бессмысленны.
          jikan_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${JIKAN_BASE:-https://api.jikan.moe/v4}/anime/1/pictures" || true)
          if [ "$jikan_code" != "200" ]; then
            echo "::warning::Jikan недоступен (HTTP ${jikan_code}) — heal пропущен, каталог не меняем."
            exit 0
          fi
          echo "Jikan OK (HTTP 200)"

          for i in 1 2 3; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::heal остановлен по внутреннему дедлайну на батче $i (остальное — следующим прогоном)."
              break
            fi
            ok=0
            for attempt in 1 2 3; do
              if node scripts/enrich-shikimori-resumable.mjs --heal --limit 150; then ok=1; break; fi
              echo "::warning::heal batch $i, попытка ${attempt}/3 не удалась — пауза $((attempt*30)) с"
              sleep $((attempt * 30))
            done
            if [ "$ok" != "1" ]; then
              echo "::warning::heal batch $i: 3 попытки не удались (Jikan), продолжаю со следующего батча"
              continue
            fi
            # Провал валидации — это порча каталога, а не капризы Jikan: не коммитим.
            if ! node scripts/validate-catalog.mjs; then
              echo "::error::validate-catalog упал после heal — коммит батча $i отменён"
              continue
            fi
            git add lib/data/titles.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(catalog): heal batch $i"
              bash scripts/push-catalog-commit.sh \
                || { echo "::error::не удалось запушить heal batch $i"; exit 1; }
            fi
            echo "heal batch $i done"
          done
      - name: fetch episode dates for finished titles (batched)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          for i in 1 2 3; do
            node scripts/fetch-episode-dates.mjs --limit 500 || true
            node scripts/validate-catalog.mjs || exit 1
            git add lib/data/titles.json .cache/episode-dates-report.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore(catalog): dates batch $i"
              bash scripts/push-catalog-commit.sh
            fi
            echo "dates batch $i done"
          done
      # Аудит 2026-10 (задача 2): офлайн-ремонт ОБЯЗАТЕЛЕН между генерацией и коммитом.
      # Новые тайтлы приходят из AniList/Jikan сырыми, а enrich-shikimori ставит t.ru из
      # Shikimori — без этого шага в каталог постепенно вернулись бы заглушки числа серий,
      # описания оборванные посреди слова, лицензиары в студиях и дубли названий.
      # Скрипт идемпотентен: проверено двойным прогоном (второй даёт 0 изменений).
      # Сетевой --fix-desc-net сюда намеренно НЕ входит (35+ минут и нагрузка на Shikimori) —
      # он в отдельном workflow repair-catalog-descriptions.yml по workflow_dispatch.
      - name: repair catalog data (offline, idempotent)
        run: node scripts/repair-catalog.mjs --fix-episodes --fix-desc --fix-dupes --fix-studios --apply
      # Предохранитель: не коммитим, если каталог похудел или дефектов больше порога.
      - name: catalog quality gate (blocks the commit)
        run: node scripts/check-catalog-quality.mjs --gate
      - name: commit if changed
        run: |
          set -euo pipefail
          node scripts/validate-catalog.mjs
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          git add lib/data/titles.json
          # Кэши — по одному с || true: git add с несуществующим pathspec падает (fatal: pathspec
          # did not match any files, exit 128). providers-resolve-cache.json больше не трекается
          # (feat/db-cache: кэш в Supabase), поэтому его в коммит не добавляем вовсе.
          git add .cache/episode-dates-report.json 2>/dev/null || true
          # ВАЖНО (фикс прогона #11): проверять staged-изменения ДО коммита. Прежняя схема
          # «... || git commit; ... || git push» никогда не пушила: после коммита индекс чист,
          # --cached --quiet даёт exit 0, и push пропускался — коммит терялся на раннере.
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): auto-sync $(date -u +%F-%H%M)"
            bash scripts/push-catalog-commit.sh
          fi
