name: Sync catalog (auto-add new anime)
on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов (ТЗ 3.4): базовые проходы (популярные/онгоинги/анонсы), без deep
  workflow_dispatch:        # ручной запуск: разовое глубокое расширение каталога (+350–400 тайтлов)
    inputs:
      deep:
        description: "Глубокое расширение: хвосты favourites/фильмы/ONA/OVA (разовая порция новых тайтлов)"
        type: boolean
        default: true
      max_new:
        description: "Квота новых тайтлов MAX_NEW (0 = без лимита)"
        type: string
        default: "5000"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev || true
      - name: expand catalog (new titles + franchise links + characters)
        env:
          # dispatch: deep/max_new из inputs; cron: deep выключен, квота 200 (ТЗ блок 12).
          DEEP: ${{ inputs.deep }}
          MAX_NEW: ${{ github.event_name == 'workflow_dispatch' && inputs.max_new || '200' }}
        run: node scripts/expand-catalog.mjs 12 --report
      - name: remove hentai (18+ policy, safety net)
        run: node scripts/remove-hentai.mjs
      - name: enrich with Shikimori (RU titles, descriptions, screenshots)
        run: node scripts/enrich-shikimori-resumable.mjs
        continue-on-error: true
        timeout-minutes: 25
      - name: fetch episode dates for finished titles
        run: node scripts/fetch-episode-dates.mjs
        continue-on-error: true
        timeout-minutes: 20
      - name: commit if changed
        run: |
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          git add lib/data/titles.json
          # кэши — по одному с || true: git add с несуществующим pathspec падает (fatal: pathspec
          # did not match any files, exit 128), а bridge в GH Actions не запускается, поэтому
          # providers-resolve-cache.json на раннере может отсутствовать. .cache/img/ не добавляем.
          git add .cache/providers-resolve-cache.json 2>/dev/null || true
          git add .cache/episode-dates-report.json 2>/dev/null || true
          # ВАЖНО (фикс прогона #11): проверять staged-изменения ДО коммита. Прежняя схема
          # «... || git commit; ... || git push» никогда не пушила: после коммита индекс чист,
          # --cached --quiet даёт exit 0, и push пропускался — коммит терялся на раннере.
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): auto-sync $(date -u +%F-%H%M)"
            git push
          fi
