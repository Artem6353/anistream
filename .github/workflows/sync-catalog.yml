name: Sync catalog (auto-add new anime)
on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов (ТЗ 3.4): базовые проходы (популярные/онгоинги/анонсы), без deep
  workflow_dispatch:        # ручной запуск: разовое глубокое расширение каталога (+350–400 тайтлов)
    inputs:
      deep:
        description: "Глубокое расширение: хвосты favourites/фильмы/ONA/OVA (разовая порция новых тайтлов)"
        type: boolean
        default: true
      max_new:
        description: "Квота новых тайтлов MAX_NEW (0 = без лимита)"
        type: string
        default: "3000"
      use_jikan:
        description: "Добор каталога через Jikan (MyAnimeList): только ручной запуск, cron не гоняет"
        type: boolean
        default: false
# Prevent scheduled and manual catalog sync jobs from racing while committing batches.
concurrency:
  group: aninova-catalog-sync
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev || true
      - name: validate catalog before external updates
        run: node scripts/validate-catalog.mjs
      - name: expand catalog (new titles + franchise links + characters)
        env:
          # dispatch: deep/max_new из inputs; cron: deep выключен, квота 200 (ТЗ блок 12).
          DEEP: ${{ inputs.deep }}
          MAX_NEW: ${{ github.event_name == 'workflow_dispatch' && inputs.max_new || '200' }}
        run: node scripts/expand-catalog.mjs 12 --report
      - name: fetch jikan (MyAnimeList extra)
        if: ${{ inputs.use_jikan == true }}
        run: node scripts/fetch-jikan.mjs --limit 3000
        timeout-minutes: 60
        continue-on-error: true
      - name: remove hentai (18+ policy, safety net)
        run: node scripts/remove-hentai.mjs
      - name: validate catalog after initial mutations
        run: node scripts/validate-catalog.mjs
      - name: enrich with Shikimori (batched)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          # If an unrelated PR advances main after checkout, retry by rebasing this
          # single catalog batch on the latest main. Never force-push catalog data.
          push_catalog_commit() {
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              if git push origin HEAD:main; then
                return 0
              fi
              echo "::warning::Catalog push rejected; fetch main and rebase (attempt $attempt/3)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Catalog batch conflicts with latest main; no force-push attempted. Rerun after reviewing the conflict."
                return 1
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::Catalog push failed after three attempts."
            return 1
          }
          for i in 1 2 3 4 5 6; do
            node scripts/enrich-shikimori-resumable.mjs --limit 500 || true
            node scripts/validate-catalog.mjs || exit 1
            git add lib/data/titles.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(catalog): enrich batch $i"
              push_catalog_commit
            fi
            echo "batch $i done"
          done
      - name: heal screenshots+characters (batched, Jikan pictures)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          # If an unrelated PR advances main after checkout, retry by rebasing this
          # single catalog batch on the latest main. Never force-push catalog data.
          push_catalog_commit() {
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              if git push origin HEAD:main; then
                return 0
              fi
              echo "::warning::Catalog push rejected; fetch main and rebase (attempt $attempt/3)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Catalog batch conflicts with latest main; no force-push attempted. Rerun after reviewing the conflict."
                return 1
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::Catalog push failed after three attempts."
            return 1
          }
          for i in 1 2 3 4 5 6; do
            node scripts/enrich-shikimori-resumable.mjs --heal --limit 500 || true
            node scripts/validate-catalog.mjs || exit 1
            git add lib/data/titles.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(catalog): heal batch $i"
              push_catalog_commit
            fi
            echo "heal batch $i done"
          done
      - name: fetch episode dates for finished titles (batched)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          # If an unrelated PR advances main after checkout, retry by rebasing this
          # single catalog batch on the latest main. Never force-push catalog data.
          push_catalog_commit() {
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              if git push origin HEAD:main; then
                return 0
              fi
              echo "::warning::Catalog push rejected; fetch main and rebase (attempt $attempt/3)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Catalog batch conflicts with latest main; no force-push attempted. Rerun after reviewing the conflict."
                return 1
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::Catalog push failed after three attempts."
            return 1
          }
          for i in 1 2 3; do
            node scripts/fetch-episode-dates.mjs --limit 500 || true
            node scripts/validate-catalog.mjs || exit 1
            git add lib/data/titles.json .cache/episode-dates-report.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore(catalog): dates batch $i"
              push_catalog_commit
            fi
            echo "dates batch $i done"
          done
      - name: commit if changed
        run: |
          set -euo pipefail
          node scripts/validate-catalog.mjs
          git config user.name "anistream-bot"
          git config user.email "bot@anistream.local"
          # If an unrelated PR advances main after checkout, retry by rebasing this
          # single catalog batch on the latest main. Never force-push catalog data.
          push_catalog_commit() {
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              if git push origin HEAD:main; then
                return 0
              fi
              echo "::warning::Catalog push rejected; fetch main and rebase (attempt $attempt/3)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Catalog batch conflicts with latest main; no force-push attempted. Rerun after reviewing the conflict."
                return 1
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::Catalog push failed after three attempts."
            return 1
          }
          git add lib/data/titles.json
          # кэши — по одному с || true: git add с несуществующим pathspec падает (fatal: pathspec
          # did not match any files, exit 128), а bridge в GH Actions не запускается, поэтому
          # providers-resolve-cache.json на раннере может отсутствовать. .cache/img/ не добавляем.
          git add .cache/providers-resolve-cache.json 2>/dev/null || true
          git add .cache/episode-dates-report.json 2>/dev/null || true
          # ВАЖНО (фикс прогона #11): проверять staged-изменения ДО коммита. Прежняя схема
          # «... || git commit; ... || git push» никогда не пушила: после коммита индекс чист,
          # --cached --quiet даёт exit 0, и push пропускался — коммит терялся на раннере.
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): auto-sync $(date -u +%F-%H%M)"
            push_catalog_commit
          fi
